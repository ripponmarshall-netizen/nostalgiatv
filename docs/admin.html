<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Yaad TV · Control room</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: env(safe-area-inset-top) 12px 40px; font: 16px -apple-system, system-ui, sans-serif;
    background: #111; color: #eee; }
  h1 { font-size: 22px; margin: 14px 0; }
  input, select, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: #eee; }
  button { background: #333; cursor: pointer; }
  button.go { background: #1f6f2e; } button.stop { background: #7a2018; }
  button:disabled { opacity: .4; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .bar input { flex: 1; min-width: 180px; }
  #previewWrap { position: sticky; top: 0; z-index: 2; background: #111; padding: 6px 0; }
  #preview { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; }
  .card { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 10px; border: 1px solid #333; border-radius: 10px; margin: 8px 0; }
  .card img { width: 96px; border-radius: 6px; }
  .card input, .card select { width: 100%; margin: 3px 0; }
  .meta { font-size: 13px; opacity: .7; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  #status { min-height: 1.3em; color: #7CFF6B; }
  .err { color: #ff6b6b !important; }
</style>
</head>
<body>
  <h1>📡 Yaad TV control room</h1>

  <div class="bar">
    <input id="token" type="password" placeholder="Admin token (ADMIN_TOKEN in Convex)" autocomplete="off">
    <button id="saveToken">Unlock</button>
  </div>
  <div class="bar">
    <select id="filter">
      <option value="pending">Pending</option>
      <option value="flagged">Flagged (failed to play)</option>
      <option value="approved">On air</option>
      <option value="rejected">Rejected</option>
    </select>
    <button id="seed">Create channels</button>
  </div>
  <div id="status"></div>

  <div id="previewWrap"><div id="preview"></div>
    <div class="meta" id="previewInfo">Tap “Preview” on a clip. Its length is measured once it starts playing.</div></div>

  <div id="list"></div>

<script src="config.js"></script>
<script src="https://unpkg.com/convex@1.51.0/dist/browser.bundle.js"></script>
<script>
(() => {
  const client = new convex.ConvexClient(window.RETRO_TV.CONVEX_URL);
  const api = convex.anyApi;
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const say = (t, bad) => { $("status").textContent = t; $("status").className = bad ? "err" : ""; };
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  let token = store.get("adminToken") || "";
  $("token").value = token;
  const measured = {}; // clipId -> seconds

  // ---------- preview player ----------
  let player, previewId = null;
  const yt = document.createElement("script"); yt.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(yt);
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player("preview", {
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING && previewId) {
            const d = player.getDuration();
            if (d > 0) {
              measured[previewId] = d;
              $("previewInfo").textContent = `Measured ${fmt(d)}. Embedding works. Approve when happy.`;
              const inp = document.querySelector(`[data-dur="${previewId}"]`);
              if (inp) inp.value = Math.floor(d);
              const btn = document.querySelector(`[data-approve="${previewId}"]`);
              if (btn) btn.disabled = false;
            }
          }
        },
        onError: (e) => {
          $("previewInfo").textContent = `This one won't embed (YouTube error ${e.data}). Reject it.`;
        },
      },
    });
  };

  // ---------- list ----------
  let unsub = null;
  function subscribe() {
    if (unsub) unsub();
    if (!token) { say("Enter your admin token.", true); return; }
    const status = $("filter").value;
    unsub = client.onUpdate(api.tv.adminList, { token, status }, render, (err) => say("Locked: wrong token?", true));
  }

  function render(rows) {
    say(`${rows.length} clip(s)`);
    const list = $("list"); list.innerHTML = "";
    for (const c of rows) {
      const card = document.createElement("div"); card.className = "card";
      const img = document.createElement("img"); img.src = `https://i.ytimg.com/vi/${c.youtubeId}/mqdefault.jpg`; img.alt = "";
      const body = document.createElement("div");

      const title = document.createElement("input"); title.value = c.title;
      const ch = document.createElement("select");
      for (const [v, l] of [["ads", "Ads & Jingles"], ["shows", "Shows & Comedy"], ["news", "News & Moments"], ["music", "Music & Videos"]])
        ch.add(new Option(l, v, false, v === c.channel));
      const dur = document.createElement("input"); dur.type = "number"; dur.min = "1"; dur.placeholder = "Length (sec)";
      dur.dataset.dur = c._id; dur.value = c.durationSec || (measured[c._id] ? Math.floor(measured[c._id]) : "");

      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = [c.decade, c.durationSec ? fmt(c.durationSec) : null, `${c.likes} 👍`, c.failCount ? `${c.failCount} fails` : null,
        new Date(c.submittedAt).toLocaleDateString("en-GB")].filter(Boolean).join(" · ");

      const actions = document.createElement("div"); actions.className = "actions";
      const prev = document.createElement("button"); prev.textContent = "▶ Preview";
      prev.onclick = () => { previewId = c._id; $("previewInfo").textContent = "Loading…"; player && player.loadVideoById(c.youtubeId); scrollTo({ top: 0, behavior: "smooth" }); };
      actions.append(prev);

      if (c.status !== "approved") {
        const ok = document.createElement("button"); ok.className = "go";
        ok.textContent = c.status === "flagged" ? "Restore" : "✔ Approve";
        ok.dataset.approve = c._id; ok.disabled = !dur.value;
        dur.oninput = () => (ok.disabled = !(+dur.value > 0));
        ok.onclick = () => act(c.status === "flagged"
          ? client.mutation(api.tv.restore, { token, clipId: c._id })
          : client.mutation(api.tv.approve, { token, clipId: c._id, durationSec: +dur.value, title: title.value, channel: ch.value }),
          "On air ✔");
        actions.append(ok);
      }
      if (c.status !== "rejected") {
        const no = document.createElement("button"); no.className = "stop";
        no.textContent = c.status === "approved" ? "Pull off air" : "✖ Reject";
        no.onclick = () => act(client.mutation(api.tv.reject, { token, clipId: c._id }), "Removed");
        actions.append(no);
      }

      body.append(title, ch, dur, meta, actions);
      card.append(img, body);
      list.append(card);
    }
  }

  async function act(promise, okText) {
    try { await promise; say(okText); } catch (e) { say((e && e.data) || e.message || "Failed", true); }
  }

  $("saveToken").onclick = () => { token = $("token").value.trim(); store.set("adminToken", token); subscribe(); };
  $("filter").onchange = subscribe;
  $("seed").onclick = async () => {
    try { const n = await client.mutation(api.tv.seedChannels, { token }); say(n ? `Created ${n} channel(s)` : "Channels already exist"); }
    catch (e) { say((e && e.data) || e.message || "Failed", true); }
  };

  subscribe();
})();
</script>
</body>
</html>
